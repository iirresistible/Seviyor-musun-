<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beni Seviyor Musun? 💜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root{
      --pink:#ff79c6;
      --purple:#c084fc;
      --green:#34d399;
      --bg1:#ec4899;
      --bg2:#d946ef;
      --bg3:#f472b6;
      --text:#fff7fb;
    }
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{
      margin:0;
      color:var(--text);
      font-family: 'Nunito', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      overflow:hidden;
      background: linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
      background-size: 400% 400%;
      animation: bgMove 20s ease infinite;
    }
    @keyframes bgMove{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    .sparkles::before, .sparkles::after{
      content:""; position:absolute; inset:0; pointer-events:none; background-repeat:repeat; mix-blend-mode:screen;
      background-image: radial-gradient(circle at 10px 10px, rgba(255,255,255,.55) 0 2px, transparent 3px),
                        radial-gradient(circle at 60px 40px, rgba(255,255,255,.35) 0 1.5px, transparent 2.5px),
                        radial-gradient(circle at 120px 80px, rgba(255,255,255,.45) 0 2px, transparent 3px),
                        radial-gradient(circle at 200px 140px, rgba(255,255,255,.35) 0 1.5px, transparent 2.5px);
      background-size: 240px 180px;
      animation: sparkle 12s linear infinite;
      opacity: .6;
    }
    .sparkles::after{ animation-duration: 18s; opacity:.4; filter: blur(0.6px); }
    @keyframes sparkle{ from{background-position:0 0} to{background-position:240px -180px} }

    .hearts{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    .heart{ position:absolute; bottom:-40px; left:var(--x,50%); font-size:var(--s,22px); opacity:.8; animation: float 6s linear var(--d,0s) infinite; }
    @keyframes float{ to{ transform: translateY(-120vh) translateX(-20px) rotate(12deg); opacity:0 } }

    .wrap{ position:relative; height:100%; display:grid; place-items:center; padding:24px; }
    .card{ position:relative; width:min(720px, 94vw); border-radius:28px; padding:24px 24px 30px; background:rgba(255,255,255,.06); backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.12); }

    h1{ margin:8px 0 2px; font-size: clamp(32px, 6.4vw, 64px); text-align:center; font-weight:900; letter-spacing:.5px; color:#fff; text-shadow: 0 0 7px rgba(255, 102, 204, .8), 0 0 22px rgba(236,72,153,.45); }
    .sub{ text-align:center; opacity:.9; margin-bottom:6px; font-weight:700; }

    .art{
      display:grid; place-items:center; margin:6px auto 18px; width:min(380px,70vw); aspect-ratio: 1/1; border-radius:24px; background:rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
      position:relative;
    }
    .art img{ width:84%; max-height:84%; object-fit:contain; filter: drop-shadow(0 10px 24px rgba(0,0,0,.25)); animation: bob 3.2s ease-in-out infinite; border-radius:22px; }

    @keyframes bob{ 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-6px) } }
    .art::after{content:""; position:absolute; inset:-6px; border-radius:28px; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 45%), radial-gradient(circle at 70% 80%, rgba(255,192,203,.28), transparent 50%); filter: blur(10px); opacity:.7; z-index:0}

    .btns{ display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; }
    button{ border:0; cursor:pointer; font-weight:900; padding:14px 26px; border-radius:999px; font-size:18px; transition: transform .07s ease, box-shadow .2s ease, filter .2s ease; }
    .yes{ background: linear-gradient(180deg, #f9a8d4, #ec4899); color:#fff; box-shadow:0 10px 30px rgba(236,72,153,.5); }
    .no{ background: linear-gradient(180deg, #c4b5fd, #9333ea); color:#fff; box-shadow:0 10px 30px rgba(147,51,234,.5); }
    button:hover{ transform: translateY(-2px) scale(1.03); }
    button:active{ transform: translateY(0) scale(.98); }

    .note{ text-align:center; opacity:.7; font-size:13px; margin-top:10px; }

    @media (max-width:520px){
      .art{ border-radius:20px; }
      button{ padding:13px 22px; font-size:17px; }
      .card{ padding:18px 16px 24px; }
    }
  </style>
</head>
<body>
  <div class="sparkles"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <div class="wrap">
    <div class="card">
      <div class="sub">Sadece dürüst ol lütfen 🤭</div>
      <h1>Beni Seviyor Musun?</h1>

      <div class="art">
        <img id="char" alt="Dudu ve Bubu" draggable="false" src="https://getbubududu.com/wp-content/uploads/2025/02/Bubu-and-Dudu.png">
      </div>

      <div class="btns">
        <button class="no" id="noBtn" type="button">Hayır</button>
        <button class="yes" id="yesBtn" type="button">Evet</button>
      </div>

      <div class="note">İpucu: "Hayır" butonu biraz utangaç olabilir 😳</div>
    </div>
  </div>

  <canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;"></canvas>

  <script>
    const hearts = document.getElementById('hearts');
    const emojis = ['💖','💘','💝','💗','💞','💟','💕'];
    function spawnHeart(){
      const span = document.createElement('span');
      span.className = 'heart';
      span.textContent = emojis[(Math.random()*emojis.length)|0];
      span.style.setProperty('--x', Math.random()*100 + '%');
      span.style.setProperty('--s', (18 + Math.random()*18) + 'px');
      span.style.setProperty('--d', (Math.random()*6) + 's');
      hearts.appendChild(span);
      setTimeout(()=> span.remove(), 6000);
    }
    setInterval(spawnHeart, 650);

    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const wrap = document.querySelector('.card');
    let clickCount = 0;
    let locked = false;

    function moveNo(){
      const r = wrap.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const pad = 10;
      const maxX = r.width - b.width - pad;
      const maxY = r.height - b.height - 70;
      const x = Math.max(pad, Math.min(maxX, Math.random()*maxX));
      const y = Math.max(pad, Math.min(maxY, (Math.random()*maxY) + 20));
      noBtn.style.position = 'relative';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('pointerenter', moveNo);
    noBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); moveNo(); });

    yesBtn.addEventListener('click', ()=>{
      if(locked) return;
      const t = document.querySelector('h1');
      clickCount++;
      if(clickCount === 1){
        t.textContent = 'Bir daha bir daha';
      } else if(clickCount === 2){
        t.textContent = 'BİR KERE DAHA SÖYLER MİSİN';
      } else {
        burst();
        t.textContent = 'Biliyordum! 💗';
        locked = true; // artık tekrar tıklanamaz
      }
    });

    const c = document.getElementById('confetti');
    const ctx = c.getContext('2d');
    let W,H; function size(){ W= c.width = innerWidth; H = c.height = innerHeight; } size();
    addEventListener('resize', size);

    let pieces = [];
    function burst(){
      for(let i=0;i<180;i++){
        pieces.push({
          x: W/2, y: H/2, r: 4+Math.random()*4,
          c: `hsl(${Math.random()*360},100%,65%)`,
          vx: (Math.random()-0.5)*8,
          vy: (Math.random()-0.9)*9,
          g: .18 + Math.random()*0.1,
          rot: Math.random()*Math.PI,
          vr: (Math.random()-0.5)*0.3
        });
      }
      if(!animId) animate();
      setTimeout(()=> pieces = [], 1600);
    }

    let animId = null;
    function animate(){
      animId = requestAnimationFrame(animate);
      ctx.clearRect(0,0,W,H);
      pieces.forEach(p=>{
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);
        ctx.restore();
      });
      if(pieces.length===0){ cancelAnimationFrame(animId); animId=null; ctx.clearRect(0,0,W,H); }
    }
  </script>
</body>
</html>
